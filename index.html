<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Racer - Car Racing Game</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#182848,#070b16 65%);font-family:Arial,sans-serif;color:#fff;display:flex;justify-content:center;align-items:center;padding:18px}
.game-wrap{width:min(100%,440px);text-align:center}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}.top h1{font-size:clamp(22px,6vw,30px);margin:0;color:#52f7ff;text-shadow:0 0 14px #00d9ff}.stats{display:flex;gap:8px}.stat{background:#ffffff12;border:1px solid #ffffff25;border-radius:10px;padding:8px 12px;font-weight:bold}.stat small{display:block;color:#a9b8d0;font-size:10px;margin-bottom:3px}
.game-box{position:relative;width:100%;aspect-ratio:3/5;max-height: min(72vh,700px);margin:auto;border:3px solid #35e7f5;border-radius:16px;overflow:hidden;box-shadow:0 0 28px #00cde955;background:#222}
canvas{display:block;width:100%;height:100%}.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#07101bdc;padding:24px}.overlay h2{font-size:32px;color:#5af7ff;margin:0 0 10px}.overlay p{line-height:1.5;color:#d8e4f5}.btn{border:0;border-radius:999px;padding:13px 28px;background:linear-gradient(90deg,#00c6ff,#00f5a0);color:#04121a;font-weight:900;font-size:16px;cursor:pointer}.btn:hover{filter:brightness(1.12)}.hint{font-size:12px;color:#9fb0c9;margin:12px 0}
.controls{display:flex;justify-content:center;gap:24px;margin-top:14px}.control{width:76px;height:52px;border:1px solid #4cebf5;border-radius:13px;background:#12263dcc;color:white;font-size:25px;touch-action:none;user-select:none}.control:active{background:#087e91}.footer{font-size:11px;color:#8092ac;margin-top:10px}
@media(min-width:700px){.game-box{max-height:72vh}}
</style>
</head>
<body>
<main class="game-wrap">
 <div class="top"><h1>🏎️ NEON RACER</h1><div class="stats"><div class="stat"><small>SCORE</small><span id="score">0</span></div><div class="stat"><small>BEST</small><span id="best">0</span></div></div></div>
 <div class="game-box"><canvas id="game" width="420" height="700"></canvas><div class="overlay" id="overlay"><h2>NEON RACER</h2><p>Elak kereta lain dan kumpul score!<br>Guna ← → atau A / D untuk bergerak.</p><button class="btn" id="start">MULA BERMAIN</button><div class="hint">Desktop: Arrow keys / A-D<br>Mobile: butang kiri dan kanan</div></div></div>
 <div class="controls"><button class="control" id="left" aria-label="Kiri">◀</button><button class="control" id="right" aria-label="Kanan">▶</button></div>
 <div class="footer">NEON RACER • Dibina dengan HTML, CSS & JavaScript</div>
</main>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),overlay=document.getElementById('overlay'),startBtn=document.getElementById('start');
const W=canvas.width,H=canvas.height,road={x:55,w:310};
let player,enemies,lines,score,best=Number(localStorage.getItem('neonRacerBest')||0),speed,spawn,frame,running=false,keys={left:false,right:false},last=0;
bestEl.textContent=best;
function reset(){player={x:W/2-22,y:H-125,w:44,h:76,speed:6.5};enemies=[];lines=Array.from({length:10},(_,i)=>i*90);score=0;speed=5;spawn=0;frame=0;scoreEl.textContent='0';}
function roundedRect(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function drawCar(x,y,w,h,color,playerCar=false){
 roundedRect(x,y,w,h,9,color);roundedRect(x+7,y+12,w-14,22,5,playerCar?'#bffaff':'#a9c8df');
 roundedRect(x+7,y+h-29,w-14,18,5,'#172536');
 ctx.fillStyle='#fff2a6';ctx.fillRect(x+5,y+4,8,5);ctx.fillRect(x+w-13,y+4,8,5);
 ctx.fillStyle='#ff465f';ctx.fillRect(x+5,y+h-8,8,5);ctx.fillRect(x+w-13,y+h-8,8,5);
 ctx.fillStyle='#080d15';ctx.fillRect(x-4,y+14,5,17);ctx.fillRect(x+w-1,y+14,5,17);ctx.fillRect(x-4,y+h-25,5,17);ctx.fillRect(x+w-1,y+h-25,5,17);
}
function drawRoad(){
 ctx.fillStyle='#17633f';ctx.fillRect(0,0,W,H);ctx.fillStyle='#343a46';ctx.fillRect(road.x,0,road.w,H);
 ctx.fillStyle='#f3f3f3';ctx.fillRect(road.x+7,0,5,H);ctx.fillRect(road.x+road.w-12,0,5,H);
 ctx.fillStyle='#e9e9e9';for(let y of lines){ctx.fillRect(W/2-4,y,8,48)}
 ctx.fillStyle='#b8b8b8';ctx.fillRect(road.x+road.w/3,0,2,H);ctx.fillRect(road.x+road.w*2/3,0,2,H);
}
function collision(a,b){return a.x+7<b.x+b.w-7&&a.x+a.w-7>b.x+7&&a.y+9<b.y+b.h-8&&a.y+a.h-9>b.y+8}
function endGame(){running=false;best=Math.max(best,Math.floor(score));localStorage.setItem('neonRacerBest',best);bestEl.textContent=best;overlay.innerHTML='<h2>GAME OVER!</h2><p>Score anda: <b>'+Math.floor(score)+'</b><br>Rekod terbaik: <b>'+best+'</b></p><button class="btn" id="restart">MAIN LAGI</button><div class="hint">Cuba elak kereta lebih lama!</div>';overlay.style.display='flex';document.getElementById('restart').onclick=startGame;}
function update(dt){
 frame++;speed=Math.min(12,5+score/180);score+=dt*0.012;scoreEl.textContent=Math.floor(score);
 if(keys.left)player.x-=player.speed*(dt/16.67);if(keys.right)player.x+=player.speed*(dt/16.67);
 player.x=Math.max(road.x+16,Math.min(road.x+road.w-player.w-16,player.x));
 lines=lines.map(y=>y+speed*(dt/16.67));if(lines[0]>H)lines=lines.map(y=>y-H-90);
 spawn-=dt;if(spawn<=0){const lane= Math.floor(Math.random()*3);const laneW=road.w/3;enemies.push({x:road.x+lane*laneW+laneW/2-21,y:-90,w:42,h:72,color:['#ff3b63','#ffc247','#a66bff','#43e0a0'][Math.floor(Math.random()*4)]});spawn=Math.max(430,950-score*2)+Math.random()*350;}
 enemies.forEach(e=>e.y+=speed*(dt/16.67));enemies=enemies.filter(e=>e.y<H+100);
 for(const e of enemies)if(collision(player,e)){endGame();return;}
}
function render(){drawRoad();enemies.forEach(e=>drawCar(e.x,e.y,e.w,e.h,e.color));drawCar(player.x,player.y,player.w,player.h,'#00d9ff',true);}
function loop(t){if(!running)return;const dt=Math.min(40,t-last||16.67);last=t;update(dt);render();if(running)requestAnimationFrame(loop);}
function startGame(){reset();overlay.style.display='none';running=true;last=performance.now();requestAnimationFrame(loop);}
function setKey(k,v){if(k==='ArrowLeft'||k==='a'||k==='A')keys.left=v;if(k==='ArrowRight'||k==='d'||k==='D')keys.right=v;}
document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();setKey(e.key,true);});
document.addEventListener('keyup',e=>setKey(e.key,false));
function bindButton(id,key){const el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.preventDefault();keys[key]=true;el.setPointerCapture(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>el.addEventListener(ev,()=>keys[key]=false));}
bindButton('left','left');bindButton('right','right');startBtn.onclick=startGame;
reset();render();
</script>
</body>
</html>
